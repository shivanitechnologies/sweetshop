<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="sweetbliss-logo">
  <!-- Decorative Heritage Crest Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer Glow / Background Shield -->
    <rect x="2" y="2" width="52" height="52" rx="14" fill="#7B263A" />
    <rect x="4" y="4" width="48" height="48" rx="12" stroke="#D6A653" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.8" />
    
    <!-- Traditional Kalash / Diya / Royal Sweet Icon -->
    <!-- Base Plate -->
    <path d="M18 43 C18 41, 38 41, 38 43 L36 45 C36 46, 20 46, 20 45 Z" fill="#D6A653" />
    <!-- Kalash / Bowl Body -->
    <path d="M16 28 C16 39, 40 39, 40 28 C37 28, 35 30, 28 30 C21 30, 19 28, 16 28 Z" fill="#D6A653" />
    <!-- Sweets Mound / Ladoo / Modak Crown -->
    <path d="M28 14 C24 19, 21 24, 21 27 C24 28, 32 28, 35 27 C35 24, 32 19, 28 14 Z" fill="#F8E7C9" />
    <path d="M28 11 C26.5 13.5, 25 16, 28 19 C31 16, 29.5 13.5, 28 11 Z" fill="#D6A653" />
    <!-- Saffron / Royal Tilak Accent -->
    <circle cx="28" cy="23" r="2" fill="#7B263A" />
    <circle cx="24" cy="33" r="1.5" fill="#7B263A" />
    <circle cx="32" cy="33" r="1.5" fill="#7B263A" />
    <!-- Radiance Rays -->
    <path d="M28 6 L28 9" stroke="#D6A653" stroke-width="1.5" stroke-linecap="round" />
    <path d="M19 9 L21 11.5" stroke="#D6A653" stroke-width="1.2" stroke-linecap="round" />
    <path d="M37 9 L35 11.5" stroke="#D6A653" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Typography: SweetBliss -->
  <text x="68" y="34" font-family="'Poppins', sans-serif" font-size="24" font-weight="800" fill="#7B263A" letter-spacing="-0.5" class="logo-text-primary">
    Sweet<tspan fill="#D6A653">Bliss</tspan>
  </text>
  
  <!-- Subtitle: Traditional Mithai & Snacks -->
  <text x="69" y="48" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#8C7A6B" letter-spacing="1.8" class="logo-text-secondary">
    TRADITIONAL MITHAI &amp; SNACKS
  </text>
  
  <!-- Tiny Royal Emblem Star -->
  <path d="M260 26 L262 30 L266 31 L263 34 L264 38 L260 36 L256 38 L257 34 L254 31 L258 30 Z" fill="#D6A653" opacity="0.85" />
</svg>
